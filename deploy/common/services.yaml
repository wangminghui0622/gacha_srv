# 业务服务公共定义（13 个服务 + 迁移 job）。
# 由各环境 compose 通过 `-f` 合并引用；基础设施（MySQL/Redis/Etcd）在 infra/compose.yaml，
# dev/test 一并引入，staging/product 用外部托管。
#
# 配置模板（deploy/conf/*.yaml）用 ${MYSQL_HOST}/${MYSQL_PASS}/${REDIS_HOST}/${REDIS_PASS}/
# ${ETCD_ENDPOINTS} 占位，运行时由镜像 entrypoint 用 envsubst 替换（密码不打进镜像）。

# 公共环境变量锚点：地址默认容器服务名，密码从 .env 注入（staging/product 覆盖为外部地址）
x-common-env: &common-env
  MYSQL_HOST: ${MYSQL_HOST:-mysql}
  MYSQL_PASS: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PASS: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
  ETCD_ENDPOINTS: ${ETCD_ENDPOINTS:-etcd:2379}
  # 直连服务名（多副本）时用 round_robin 负载均衡：gateway→DTM、DTM→RPC 回调均依赖
  GRPC_SERVICE_CONFIG: '{"loadBalancingConfig":[{"round_robin":{}}]}'

# 服务公共运行配置
x-runtime: &runtime
  restart: unless-stopped
  networks: [backend]

# 基础设施就绪前置（etcd + mysql + 迁移完成 + dtm）。
# mysql/etcd 用 required: false：dev/test 由 infra/compose.yaml 提供时生效，
# staging/product 用外部托管基础设施时（compose 里无 mysql/etcd 服务）自动跳过。
x-base-deps: &base-deps
  etcd:
    condition: service_healthy
    required: false
  mysql:
    condition: service_healthy
    required: false
  migrate:
    condition: service_completed_successfully
  dtm:
    condition: service_started

services:
  # ── 迁移（一次性 job，建库建表 + 种子数据）──
  migrate:
    image: ${REGISTRY:-}gacha/migrate:${IMAGE_TAG:-dev}
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    networks: [backend]

  # ── DTM（SAGA 分布式事务）──
  dtm:
    <<: *runtime
    image: ${REGISTRY:-}gacha/dtm:${IMAGE_TAG:-dev}
    environment: *common-env
    expose: ["36789", "36790"]
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      etcd:
        condition: service_healthy
        required: false
      migrate:
        condition: service_completed_successfully

  # ── 无下游依赖的基础 RPC ──
  base-rpc:
    <<: *runtime
    image: ${REGISTRY:-}gacha/base-rpc:${IMAGE_TAG:-dev}
    environment: *common-env
    expose: ["9314"]
    depends_on: *base-deps

  catalog-rpc:
    <<: *runtime
    image: ${REGISTRY:-}gacha/catalog-rpc:${IMAGE_TAG:-dev}
    environment: *common-env
    expose: ["9318"]
    depends_on: *base-deps

  draw-rpc:
    <<: *runtime
    image: ${REGISTRY:-}gacha/draw-rpc:${IMAGE_TAG:-dev}
    environment: *common-env
    expose: ["9313"]
    depends_on: *base-deps

  task-rpc:
    <<: *runtime
    image: ${REGISTRY:-}gacha/task-rpc:${IMAGE_TAG:-dev}
    environment: *common-env
    expose: ["9317"]
    depends_on: *base-deps

  ops-rpc:
    <<: *runtime
    image: ${REGISTRY:-}gacha/ops-rpc:${IMAGE_TAG:-dev}
    environment: *common-env
    expose: ["9320"]
    depends_on: *base-deps

  thirdparty-rpc:
    <<: *runtime
    image: ${REGISTRY:-}gacha/thirdparty-rpc:${IMAGE_TAG:-dev}
    environment: *common-env
    expose: ["9319"]
    depends_on:
      <<: *base-deps
      ops-rpc:
        condition: service_started

  identity-rpc:
    <<: *runtime
    image: ${REGISTRY:-}gacha/identity-rpc:${IMAGE_TAG:-dev}
    environment: *common-env
    expose: ["9311"]
    depends_on:
      <<: *base-deps
      thirdparty-rpc:
        condition: service_started

  # ── 循环依赖组（money↔marketing↔play，靠 Etcd 发现 + go-zero RPC 重试自愈，不写 depends_on）──
  money-rpc:
    <<: *runtime
    image: ${REGISTRY:-}gacha/money-rpc:${IMAGE_TAG:-dev}
    environment: *common-env
    expose: ["9312"]
    depends_on: *base-deps

  marketing-rpc:
    <<: *runtime
    image: ${REGISTRY:-}gacha/marketing-rpc:${IMAGE_TAG:-dev}
    environment: *common-env
    expose: ["9315"]
    depends_on: *base-deps

  play-rpc:
    <<: *runtime
    image: ${REGISTRY:-}gacha/play-rpc:${IMAGE_TAG:-dev}
    environment: *common-env
    expose: ["9316"]
    depends_on: *base-deps

  # ── 网关（最后启动，聚合所有 RPC）──
  gateway:
    <<: *runtime
    image: ${REGISTRY:-}gacha/gateway:${IMAGE_TAG:-dev}
    environment: *common-env
    expose: ["9310"]
    depends_on:
      identity-rpc: { condition: service_started }
      money-rpc: { condition: service_started }
      draw-rpc: { condition: service_started }
      base-rpc: { condition: service_started }
      marketing-rpc: { condition: service_started }
      play-rpc: { condition: service_started }
      task-rpc: { condition: service_started }

  admin-gateway:
    <<: *runtime
    image: ${REGISTRY:-}gacha/admin-gateway:${IMAGE_TAG:-dev}
    environment: *common-env
    expose: ["9321"]
    depends_on:
      ops-rpc: { condition: service_started }
      draw-rpc: { condition: service_started }
      marketing-rpc: { condition: service_started }
      play-rpc: { condition: service_started }
      catalog-rpc: { condition: service_started }
      base-rpc: { condition: service_started }
      money-rpc: { condition: service_started }

networks:
  backend:
    driver: bridge
