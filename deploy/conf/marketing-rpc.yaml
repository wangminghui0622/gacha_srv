Name: marketing.rpc
# 本机开发全链路：绑定回环地址，Etcd 注册固定 127.0.0.1（避免网卡/VPN 切换后注册 IP 失效）
# 营销域 = 旧仓 game-rpc 拆出的 promotion + campaign 合并：报价/券/忠诚度 + 活动。
ListenOn: 0.0.0.0:9315

Etcd:
  Hosts:
    - ${ETCD_ENDPOINTS}
  Key: marketing.rpc

MySQL:
  DataSource: root:${MYSQL_PASS}@tcp(${MYSQL_HOST}:3306)/gacha_marketing?charset=utf8mb4&parseTime=True&loc=Local

# 资金服务（QuoteCheckout 读积分余额用，走 Etcd；旧 UserRpc）
MoneyRpc:
  Etcd:
    Hosts:
      - ${ETCD_ENDPOINTS}
    Key: money.rpc

# 缓存版券模板模型使用的 Redis（30s 短 TTL）
CacheRedis:
  - Host: ${REDIS_HOST}:6379
    Pass: "${REDIS_PASS}"

Log:
  ServiceName: marketing-rpc
  Mode: console
  Level: info

# 指标/健康端点
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9395
  EnableMetrics: true
  EnablePprof: false  # 默认开着,显式关闭
  HealthPath: /healthz
