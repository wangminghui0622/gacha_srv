Name: draw.rpc
# 本机开发全链路：绑定回环地址，Etcd 注册固定 127.0.0.1（避免网卡/VPN 切换后注册 IP 失效）
ListenOn: 0.0.0.0:9313

Etcd:
  Hosts:
    - ${ETCD_ENDPOINTS}
  Key: draw.rpc

MySQL:
  DataSource: root:${MYSQL_PASS}@tcp(${MYSQL_HOST}:3306)/gacha_draw?charset=utf8mb4&parseTime=True&loc=Local

# 缓存版宝箱/奖池条目模型使用的 Redis
CacheRedis:
  - Host: ${REDIS_HOST}:6379
    Pass: "${REDIS_PASS}"

Log:
  ServiceName: draw-rpc
  Mode: console
  Level: info

# 指标/健康端点
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9393
  EnableMetrics: true
  EnablePprof: false  # 默认开着,显式关闭
  HealthPath: /healthz
