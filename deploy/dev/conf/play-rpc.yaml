Name: play.rpc
# 本机开发全链路：绑定回环地址，Etcd 注册固定 127.0.0.1（避免网卡/VPN 切换后注册 IP 失效）
# 玩法域 = 旧仓 game-rpc 拆出的 6 玩法 + 幸运指派 + 发奖标记。
ListenOn: 0.0.0.0:9316

Etcd:
  Hosts:
    - ${ETCD_ENDPOINTS}
  Key: play.rpc

MySQL:
  DataSource: root:${MYSQL_PASS}@tcp(${MYSQL_HOST}:3306)/gacha_play?charset=utf8mb4&parseTime=True&loc=Local

# 资金服务（发奖现金 CreditWallet 入账，走 Etcd；旧 UserRpc）
MoneyRpc:
  Etcd:
    Hosts:
      - ${ETCD_ENDPOINTS}
    Key: money.rpc

# 营销服务（券类奖品发券/释放退还，走 Etcd；§3.6 适配点：旧直连 user_coupons 表改走 RPC）
MarketingRpc:
  Etcd:
    Hosts:
      - ${ETCD_ENDPOINTS}
    Key: marketing.rpc

# 商品目录（发布实物 SKU 奖时校验 sku 存在性/履约方式）
CatalogRpc:
  Etcd:
    Hosts:
      - ${ETCD_ENDPOINTS}
    Key: catalog.rpc

# 玩法配置等缓存版模型使用的 Redis
CacheRedis:
  - Host: ${REDIS_HOST}:6379
    Pass: "${REDIS_PASS}"

Log:
  ServiceName: play-rpc
  Mode: console
  Level: info

# 指标/健康端点
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9396
  EnableMetrics: true
  EnablePprof: false  # 默认开着,显式关闭
  HealthPath: /healthz
