Name: admin-gateway-api
Host: 0.0.0.0
Port: 9321

OpsRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: ops.rpc

# 抽奖服务客户端（赏池控制台：草稿/版本/发布 + 箱子读取；M14b）
DrawRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: draw.rpc

# 玩法服务客户端（幸运指派：扭蛋 LUCKY 奖指定用户；M14b）
PlayRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: play.rpc

# 营销服务客户端（券模板不可变版本/发券/活动草稿发布控制台；M14d，旧 GameRpc 拆出）
MarketingRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: marketing.rpc

# 商城服务客户端（商品目录控制台：SPU/SKU 草稿/发布/修订；M14c）
CatalogRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: catalog.rpc

# 基础服务客户端（条件政策/风控案件控制台；M14d）
BaseRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: base.rpc

# 资金服务客户端（支付路由存管控制台；M14d，旧 PaymentRpc）
MoneyRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: money.rpc

# 控制台令牌本地验签（Ed25519 公钥，与 ops-rpc 的 Console.PrivateKeyBase64 配对）
Console:
  # 公钥 base64（32 字节；ops-rpc 签发，本网关持公钥验签不依赖 ops-rpc 在线）
  PublicKeyBase64: "NWp4QoCx6USyNVNcRqd4TaPcVTxysCwjeleKvsGGrp8="
  Issuer: luckybox-console
  Audience: console-api
  # fail-closed 路由校验目标里程碑（≤ 此里程碑的操作必须全部注册路由，缺失启动失败）
  FailClosedMilestone: M14e

# 会话吊销检查 Redis（键 console:session:revoked:<jti>，由 ops-rpc 写入）
CacheRedis:
  - Host: 127.0.0.1:6379
    Pass: "we7redis"

Log:
  ServiceName: admin-gateway
  Mode: console
  Level: info

# 指标/健康端点
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9401
  EnableMetrics: true
  EnablePprof: false  # 默认开着,显式关闭
  HealthPath: /healthz

Timeout: 10000
