Name: money.rpc
# 本机开发全链路：绑定回环地址，Etcd 注册固定 127.0.0.1（避免网卡/VPN 切换后注册 IP 失效）
# 资金域 = 旧仓 asset（user 拆出）+ payment 合并：钱包/资产/支付单/退款单同一库同一进程，
# 旧仓 payment→user 的钱包跨服务调用（FreezeWallet/PostHold/VoidHold/CreditWallet）变本地调用，无 UserRpc 客户端。
ListenOn: 127.0.0.1:9312

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: money.rpc

MySQL:
  DataSource: root:we7root@tcp(127.0.0.1:3306)/gacha_money?charset=utf8mb4&parseTime=True&loc=Local

# 抽奖服务（GrantAsset 反查开奖结果用，走 Etcd）
DrawRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: draw.rpc

# 营销服务（07 捕获内 sub-call CommitQuote 核销报价，走 Etcd；旧 GameRpc）
MarketingRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: marketing.rpc

# 玩法服务（CancelPayment 发奖落库前置检查 CheckPrizesGranted，走 Etcd；旧 GameRpc 五链域）
PlayRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: play.rpc

Log:
  ServiceName: money-rpc
  Mode: console
  Level: info

# 指标/健康端点
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9392
  EnableMetrics: true
  EnablePprof: false  # 默认开着,显式关闭
  HealthPath: /healthz
