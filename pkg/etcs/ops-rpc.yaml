Name: ops.rpc
# 本机开发全链路：绑定回环地址，Etcd 注册固定 127.0.0.1（避免网卡/VPN 切换后注册 IP 失效）
# 旧仓 etcs_admin/ops-rpc.yaml 并入 pkg/etcs/（单树布局）。
ListenOn: 127.0.0.1:9320

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: ops.rpc

MySQL:
  DataSource: root:we7root@tcp(127.0.0.1:3306)/gacha_ops?charset=utf8mb4&parseTime=True&loc=Local

# 业务 Redis：登录票据（TOTP challenge，5 分钟）、会话吊销键 console:session:revoked:<jti>
CacheRedis:
  - Host: 127.0.0.1:6379
    Pass: "we7redis"

# 控制台令牌（照抄 server_v2：EdDSA JWT，网关持公钥本地验签）
Console:
  # Ed25519 私钥 base64（仅本服务持有，不入库不进日志）
  # 本地开发固定密钥（与 admin-gateway-api.yaml 的公钥配对）；生产部署由注入替换并轮换
  PrivateKeyBase64: "WIdW8dlR5g3iINm4pord5o5Cu+4343+O7pBzm1t/RFA1anhCgLHpRLI1U1xGp3hNo9xVPHKwLCN6V4q+wYaunw=="
  # 公钥 base64（32 字节；写入管理网关配置）
  PublicKeyBase64: "NWp4QoCx6USyNVNcRqd4TaPcVTxysCwjeleKvsGGrp8="
  Issuer: luckybox-console
  Audience: console-api
  AccessTtlSeconds: 900
  RefreshTtlSeconds: 604800
  # 首次启动自动开通的超级管理员（仅本地开发；生产部署首登改密）
  InitialAdminUsername: admin
  # 口令规则同 server_v2：至少 12 字节
  InitialAdminPassword: admin12345678
  InitialAdminDisplayName: 超级管理员
  InitialAdminRoleCode: super_admin
  # 跳过 TOTP（仅本地开发调试；生产必须 false）
  SkipTotp: false

Log:
  ServiceName: ops-rpc
  Mode: console
  Level: info

# 指标/健康端点
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9400
  EnableMetrics: true
  EnablePprof: false  # 默认开着,显式关闭
  HealthPath: /healthz
