Name: thirdparty.rpc
# 本机开发全链路：绑定回环地址，Etcd 注册固定 127.0.0.1（避免网卡/VPN 切换后注册 IP 失效）
ListenOn: 127.0.0.1:9319

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: thirdparty.rpc

# 验证码存储与频控（go-zero 内建段，Key 为必填命名空间字段——本服务不用自带锁/脚本，客户端直连 Host；
# 存储语义照抄 server_v2 integration/sms RedisCaptchaStore）+ 微信小程序 access_token store（key
# luckybox:integration:wechat:mini:access_token）
Redis:
  Host: 127.0.0.1:6379
  Type: node
  Pass: "we7redis"
  Key: thirdparty

# M15d：gacha_thirdparty（provider 指标接入 batch/raw/current/outbox + 腾讯广告点击）
MySQL:
  DataSource: root:we7root@tcp(127.0.0.1:3306)/gacha_thirdparty?charset=utf8mb4&parseTime=True&loc=Local

# 短信双通道（照抄 server_v2；DryRun 开时跳过真实发送，验证码仍写 Redis 可调试读取；
# 888 前缀测试号跳过阿里云；两通道都关且非 DryRun → 6003）
Sms:
  DryRun: true
  Aliyun:
    Enabled: false
    AccessKeyID: ""
    AccessKeySecret: ""
    SignName: ""
    TemplateCode: ""
  Tencent:
    Enabled: false
    AccessKeyID: ""
    AccessKeySecret: ""
    SignName: ""
    TemplateID: ""
    AppID: ""

# 微信 code 交换 + 小程序全家（M15a Mini jscode2session / App oauth2；M15d access_token/手机号/
# 二维码/urllink；未配置 → 6005；APIBase/OAuthBase 可指向本地 mock server 供场景测试；App 留空 = 6005 负例）
# Mini 为开发占位配置（mock server test/tools/wechatmock），生产替换走发布流程
Wechat:
  Mini:
    AppID: "dev-appid"
    AppSecret: "dev-secret"
    APIBase: "http://127.0.0.1:9410"
    DefaultPage: "pages/index/index"
  App:
    AppID: ""
    AppSecret: ""
    OAuthBase: ""

