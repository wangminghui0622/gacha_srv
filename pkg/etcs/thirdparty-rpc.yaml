# 腾讯广告（M15d RecordClick 只按 openid 去重落库；Accounts 空 = 6009 负例，
# 开发占位账户供场景 32 正例；AccessToken 仅 ReportAction 使用——死代码未克隆）
TencentAd:
  Accounts:
    - AccountID: 1
      AccessToken: "dev-access-token"
      UserActionSetID: 1
  MiniAppID: ""

# ops-rpc 客户端（M15d 指标事件 outbox 直投 ApplyMetricEvent，走 Etcd）
OpsRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: ops.rpc

Log:
  ServiceName: thirdparty-rpc
  Mode: console
  Level: info

# 指标/健康端点
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9399
  EnableMetrics: true
  EnablePprof: false  # 默认开着,显式关闭
  HealthPath: /healthz
