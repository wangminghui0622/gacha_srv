syntax = "proto3";

package catalog;

option go_package = "./catalog";

// 商城服务（catalog 9316）：SPU/SKU 商品目录控制台（M14c）。
// 契约照抄 server_v2 CatalogService：草稿（live 表）→ 发布（快照只读）→
// 修订/变体修订（草稿 blob）→ 修订发布（版本前进 + 幂等重放）。
// 错误码段 4000：4001 商品不存在 / 4002 版本或状态冲突 / 4003 校验失败。


// 商城服务：商品目录（SPU/SKU 草稿→发布→修订，M14c 控制台契约）
service Catalog {
  // 创建商品（DRAFT + version 1；选项/SKU 全量校验）
  rpc CreateProduct(CreateProductRequest) returns (Product);
  // 查看商品（ACTIVE 读已发布快照，否则读 live 草稿表）
  rpc GetProduct(GetProductRequest) returns (Product);
rpc GetSKU(GetSKURequest) returns (SKU);
  // 商品列表（游标分页，摘要）
  rpc ListProducts(ListProductsRequest) returns (ListProductsReply);
  // IP 列表（分页 + 名称搜索，按排序权重倒序）
  rpc ListIPs(ListIPsRequest) returns (ListIPsReply);
  // 创建 IP
  rpc CreateIP(CreateIPRequest) returns (IP);
  // 编辑 IP 名称/排序权重
  rpc UpdateIP(UpdateIPRequest) returns (IP);
  // 品牌列表（分页 + 名称搜索）
  rpc ListBrands(ListBrandsRequest) returns (ListBrandsReply);
  // 创建品牌
  rpc CreateBrand(CreateBrandRequest) returns (Brand);
  // 编辑品牌名称/Logo
  rpc UpdateBrand(UpdateBrandRequest) returns (Brand);
  // 系列列表（分页 + 名称搜索 + 品牌筛选）
  rpc ListSeries(ListSeriesRequest) returns (ListSeriesReply);
  // 创建系列
  rpc CreateSeries(CreateSeriesRequest) returns (Series);
  // 编辑系列名称/品牌/排序权重
  rpc UpdateSeries(UpdateSeriesRequest) returns (Series);
  // 商品管理列表（搜索/厂商/系列/IP/销售类型/价格区间 + 分页）
  rpc ListAdminProducts(ListAdminProductsRequest) returns (ListAdminProductsReply);
  // 创建商品（后台商品页；含 IP/品牌/系列/成本/封面字段）
  rpc CreateAdminProduct(CreateAdminProductRequest) returns (AdminProduct);
  // 编辑商品（后台商品页展示字段）
  rpc UpdateAdminProduct(UpdateAdminProductRequest) returns (AdminProduct);
  // 复制商品
  rpc CopyAdminProduct(CopyAdminProductRequest) returns (AdminProduct);
  // 首次发布（DRAFT→ACTIVE，激活 SKU，版本前进落快照；已发布幂等返回）
  rpc PublishProduct(PublishProductRequest) returns (Product);
  // 读取已发布快照（任意历史版本）
  rpc GetPublishedProduct(GetPublishedProductRequest) returns (Product);
  // 保存修订（改标题/SKU 字段；草稿 blob；同内容幂等）
  rpc SaveProductRevision(SaveProductRevisionRequest) returns (Product);
  // 保存变体修订（增删规格值/SKU；稳定 SKU 组合不可变）
  rpc SaveProductVariantRevision(SaveProductVariantRevisionRequest) returns (Product);
  // 读取修订草稿
  rpc GetProductRevision(GetProductRevisionRequest) returns (Product);
  // 发布修订（版本前进 expected+1；已发布幂等重放）
  rpc PublishProductRevision(PublishProductRevisionRequest) returns (Product);
}



// ProductStatus 商品状态（与 server_v2 同值）
enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_DRAFT = 1;
  PRODUCT_STATUS_ACTIVE = 2;
  PRODUCT_STATUS_ARCHIVED = 3;
}

// FulfillmentMode 履约方式（与 server_v2 同值）
enum FulfillmentMode {
  FULFILLMENT_MODE_UNSPECIFIED = 0;
  FULFILLMENT_MODE_PHYSICAL = 1;
  FULFILLMENT_MODE_DIGITAL = 2;
  FULFILLMENT_MODE_NONE = 3;
}

// Money 金额（最小单位 + 币种）
message Money {
  int64 amountMinor = 1; // 最小单位金额（分）
  string currency = 2;   // 币种（3 字母，如 CNY）
}

message OptionValue {
  uint64 optionValueId = 1; // 选项值ID
  uint64 optionId = 2;      // 所属选项ID
  string value = 3;         // 值（如 红色）
  int32 sortOrder = 4;      // 排序
}

message ProductOption {
  uint64 optionId = 1;              // 选项ID（如 颜色）
  string name = 2;                  // 选项名
  int32 sortOrder = 3;              // 排序
  repeated OptionValue values = 4;  // 选项值
}

message SKUSelection {
  uint64 optionId = 1;      // 所选选项ID
  uint64 optionValueId = 2; // 所选选项值ID
}

message SKU {
  uint64 skuId = 1;                  // SKU ID
  uint64 productId = 2;              // 所属商品ID
  string skuCode = 3;                // SKU 编码（全局唯一）
  string title = 4;                  // SKU 标题
  ProductStatus status = 5;          // 状态
  FulfillmentMode fulfillmentMode = 6; // 履约方式
  Money salePrice = 7;               // 售价
  Money referencePrice = 8;          // 参考价
  repeated SKUSelection selections = 9; // 规格组合（每选项恰一条）
  string externalCode = 10;          // 外部编码
}

message Product {
  uint64 productId = 1;             // 商品ID
  string productCode = 2;           // 商品编码
  string title = 3;                 // 标题
  ProductStatus status = 4;         // 状态
  repeated ProductOption options = 5; // 规格选项
  repeated SKU skus = 6;            // SKU 列表
  uint64 version = 7;               // 版本号
}

message CreateOptionValueInput {
  string value = 1;     // 值
  int32 sortOrder = 2;  // 排序
}

message CreateProductOptionInput {
  string name = 1;                         // 选项名
  int32 sortOrder = 2;                     // 排序
  repeated CreateOptionValueInput values = 3; // 选项值
}

message CreateSKUSelectionInput {
  int32 optionIndex = 1; // 选项下标（指向 request.options）
  int32 valueIndex = 2;  // 值下标（指向该选项的 values）
}

message CreateSKUInput {
  string skuCode = 1;              // SKU 编码
  string title = 2;                // SKU 标题
  FulfillmentMode fulfillmentMode = 3; // 履约方式
  Money salePrice = 4;             // 售价
  Money referencePrice = 5;        // 参考价
  repeated CreateSKUSelectionInput selections = 6; // 规格选择（按 optionIndex/valueIndex）
  string externalCode = 7;         // 外部编码
}

message CreateProductRequest {
  string productCode = 1;                          // 商品编码
  string title = 2;                                // 标题
  repeated CreateProductOptionInput options = 3;   // 规格选项
  repeated CreateSKUInput skus = 4;                // SKU 列表
}

message GetProductRequest {
  uint64 productId = 1; // 商品ID
}

message GetSKURequest {
  uint64 skuId = 1; // SKU ID
}

message ProductSummary {
  uint64 productId = 1;   // 商品ID
  string productCode = 2; // 商品编码
  string title = 3;       // 标题
  ProductStatus status = 4; // 状态
  uint64 version = 5;     // 版本号
}

message ListProductsRequest {
  uint64 afterProductId = 1; // 游标：上一页最后商品ID（0=首页）
  uint32 pageSize = 2;       // 每页条数（默认 20，上限 100）
}

message ListProductsReply {
  repeated ProductSummary products = 1; // 商品摘要列表
  uint64 nextAfterProductId = 2;        // 下一页游标（0=无下一页）
}

message IP {
  uint64 ipId = 1;      // IP ID
  string name = 2;      // IP 名称
  int32 sortWeight = 3; // 排序权重（越大越靠前）
}

message ListIPsRequest {
  string keyword = 1;  // 名称模糊搜索（空=全部）
  uint32 page = 2;     // 页码（从 1 开始）
  uint32 pageSize = 3; // 每页条数（默认 15，最大 100）
}

message ListIPsReply {
  repeated IP ips = 1; // IP 列表
  uint64 total = 2;    // 总条数
  uint32 page = 3;     // 当前页码
  uint32 pageSize = 4; // 每页条数
}

message CreateIPRequest {
  string name = 1;      // IP 名称
  int32 sortWeight = 2; // 排序权重
}

message UpdateIPRequest {
  uint64 ipId = 1;      // IP ID
  string name = 2;      // IP 名称
  int32 sortWeight = 3; // 排序权重
}

message Brand {
  uint64 brandId = 1; // 品牌 ID
  string name = 2;    // 品牌名称
  string logo = 3;    // Logo 图片地址
}

message ListBrandsRequest {
  string keyword = 1;  // 名称模糊搜索（空=全部）
  uint32 page = 2;     // 页码（从 1 开始）
  uint32 pageSize = 3; // 每页条数（默认 15，最大 100）
}

message ListBrandsReply {
  repeated Brand brands = 1; // 品牌列表
  uint64 total = 2;          // 总条数
  uint32 page = 3;           // 当前页码
  uint32 pageSize = 4;       // 每页条数
}

message CreateBrandRequest {
  string name = 1; // 品牌名称
  string logo = 2; // Logo 图片地址
}

message UpdateBrandRequest {
  uint64 brandId = 1; // 品牌 ID
  string name = 2;    // 品牌名称
  string logo = 3;    // Logo 图片地址
}

message Series {
  uint64 seriesId = 1;  // 系列 ID
  string name = 2;      // 系列名称
  uint64 brandId = 3;   // 所属品牌 ID
  string brandName = 4; // 所属品牌名称
  int32 sortWeight = 5; // 排序权重（越大越靠前）
}

message ListSeriesRequest {
  string keyword = 1;  // 系列名称模糊搜索（空=全部）
  uint64 brandId = 2;  // 品牌筛选（0=全部）
  uint32 page = 3;     // 页码（从 1 开始）
  uint32 pageSize = 4; // 每页条数（默认 15，最大 100）
}

message ListSeriesReply {
  repeated Series series = 1; // 系列列表
  uint64 total = 2;           // 总条数
  uint32 page = 3;            // 当前页码
  uint32 pageSize = 4;        // 每页条数
}

message CreateSeriesRequest {
  string name = 1;      // 系列名称
  uint64 brandId = 2;   // 所属品牌 ID
  int32 sortWeight = 3; // 排序权重
}

message UpdateSeriesRequest {
  uint64 seriesId = 1;  // 系列 ID
  string name = 2;      // 系列名称
  uint64 brandId = 3;   // 所属品牌 ID
  int32 sortWeight = 4; // 排序权重
}

message AdminProduct {
  uint64 productId = 1;       // 商品 ID
  string productCode = 2;     // 商品编码
  string title = 3;           // 商品名称
  ProductStatus status = 4;   // 生命周期状态
  uint64 version = 5;         // 版本
  uint64 ipId = 6;            // IP ID
  string ipName = 7;          // IP 名称
  uint64 brandId = 8;         // 品牌 ID
  string brandName = 9;       // 品牌名称
  uint64 seriesId = 10;       // 系列 ID
  string seriesName = 11;     // 系列名称
  string saleType = 12;       // 销售类型：IN_STOCK / PREORDER
  uint64 shippedQuantity = 13;// 已发货数量
  int64 costAmountMinor = 14; // 成本价（分）
  string coverUrl = 15;       // 封面图
  int64 saleAmountMinor = 16; // 最低售价（分，来自 SKU）
}

message ListAdminProductsRequest {
  string keyword = 1;         // 商品名称/商品ID/编码
  uint64 brandId = 2;         // 厂商筛选
  uint64 seriesId = 3;        // 系列筛选
  uint64 ipId = 4;            // IP 筛选
  string saleType = 5;        // 销售类型
  int64 minPriceMinor = 6;    // 最低价格（分）
  int64 maxPriceMinor = 7;    // 最高价格（分）
  string sortBy = 8;          // shippedQuantity / costAmountMinor
  string sortOrder = 9;       // asc / desc
  uint32 page = 10;           // 页码
  uint32 pageSize = 11;       // 每页条数
}

message ListAdminProductsReply {
  repeated AdminProduct products = 1;
  uint64 total = 2;
  uint32 page = 3;
  uint32 pageSize = 4;
}

message CreateAdminProductRequest {
  string productCode = 1;     // 商品编码（空=自动生成）
  string title = 2;           // 商品名称
  uint64 ipId = 3;            // IP ID
  uint64 brandId = 4;         // 品牌 ID
  uint64 seriesId = 5;        // 系列 ID
  string saleType = 6;        // 销售类型
  int64 costAmountMinor = 7;  // 成本价（分）
  int64 saleAmountMinor = 8;  // 售价（分）
  string coverUrl = 9;        // 封面图
}

message UpdateAdminProductRequest {
  uint64 productId = 1;       // 商品 ID
  string title = 2;           // 商品名称
  uint64 ipId = 3;            // IP ID
  uint64 brandId = 4;         // 品牌 ID
  uint64 seriesId = 5;        // 系列 ID
  string saleType = 6;        // 销售类型
  int64 costAmountMinor = 7;  // 成本价（分）
  string coverUrl = 8;        // 封面图
  int64 saleAmountMinor = 9;  // 售价（分）
}

message CopyAdminProductRequest {
  uint64 productId = 1;       // 被复制商品 ID
}

message GetPublishedProductRequest {
  uint64 productId = 1; // 商品ID
  uint64 version = 2;   // 版本号（必须）
}

message PublishProductRequest {
  uint64 productId = 1;       // 商品ID
  uint64 expectedVersion = 2; // 期望版本（CAS）
}

message ReviseSKUInput {
  uint64 skuId = 1;                 // 要修订的 SKU ID（必须命中现版本 SKU）
  string title = 2;                 // 新标题
  string externalCode = 3;          // 新外部编码
  FulfillmentMode fulfillmentMode = 4; // 新履约方式
  Money salePrice = 5;              // 新售价
  Money referencePrice = 6;         // 新参考价
}

message SaveProductRevisionRequest {
  uint64 productId = 1;       // 商品ID
  uint64 expectedVersion = 2; // 期望版本（必须等于当前已发布版本）
  string title = 3;           // 新商品标题
  repeated ReviseSKUInput skus = 4; // 修订的 SKU（数量必须与现版本一致）
}

message GetProductRevisionRequest {
  uint64 productId = 1; // 商品ID
}

message PublishProductRevisionRequest {
  uint64 productId = 1;       // 商品ID
  uint64 expectedVersion = 2; // 期望版本（= 草稿 base_version，必须 ≥2）
}

message SaveProductVariantRevisionRequest {
  uint64 productId = 1;        // 商品ID
  uint64 expectedVersion = 2;  // 期望版本（必须等于当前已发布版本，≥2）
  CreateProductRequest product = 3; // 完整新版本（code 必须与现版本一致）
}
