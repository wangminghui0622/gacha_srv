syntax = "proto3";

package identity;
option go_package = "./identity";

// 账号服务：注册登录（JWT 在本服务签发校验）、手机号/微信登录与第三方身份绑定。
// 从旧仓 user.proto 拆出（资金/资产 RPC 归 asset.proto），RPC 形状与字段序号不变。

service Identity {
    rpc Register(RegisterReq) returns (RegisterResp);
    rpc Login(LoginReq) returns (LoginResp);
    rpc VerifyToken(VerifyTokenReq) returns (VerifyTokenResp);
    rpc GetProfile(GetProfileReq) returns (GetProfileResp);
    // ── M15a 手机号/微信登录（请求形状照抄 server_v2，响应维持本仓 LoginResp）──
    rpc RequestPhoneLoginCode(RequestPhoneLoginCodeReq) returns (RequestPhoneLoginCodeResp);
    rpc LoginWithPhoneCode(LoginWithPhoneCodeReq) returns (LoginResp);
    rpc LoginWithWeChatCode(LoginWithWeChatCodeReq) returns (LoginResp);
    // ── M15a 手机号绑定（内部 RPC，无网关路由——绑定入口照抄 server_v2）──
    rpc SetUserPhone(SetUserPhoneReq) returns (SetUserPhoneResp);
    rpc FindUserPhoneExact(FindUserPhoneExactReq) returns (FindUserPhoneExactResp);
    rpc SearchUserPhones(SearchUserPhonesReq) returns (SearchUserPhonesResp);
    // ── M15a 第三方身份（Link 为内部 RPC，无网关路由；登录靠 Resolve）──
    rpc LinkThirdPartyIdentity(LinkThirdPartyIdentityReq) returns (LinkThirdPartyIdentityResp);
    rpc ResolveUserByThirdParty(ResolveUserByThirdPartyReq) returns (ResolveUserByThirdPartyResp);
    rpc GetThirdPartyIdentity(GetThirdPartyIdentityReq) returns (GetThirdPartyIdentityResp);
}

message RegisterReq {
    string username = 1; // 用户名（登录账号）
    string password = 2; // 明文密码（服务端 bcrypt 加密存储）
    string nickname = 3; // 昵称（可选，默认取用户名）
}

message RegisterResp {
    int64 userId = 1; // 新用户ID
}

message LoginReq {
    string username = 1; // 用户名
    string password = 2; // 明文密码
}

message LoginResp {
    int64 userId = 1;   // 用户ID
    string token = 2;   // JWT（网关后续请求放 Authorization: Bearer <token>）
}

message VerifyTokenReq {
    string token = 1; // JWT
}

message VerifyTokenResp {
    int64 userId = 1;   // 用户ID（网关鉴权中间件写入 ctx）
    string username = 2; // 用户名
    string nickname = 3; // 昵称
}

message GetProfileReq {
    int64 userId = 1; // 用户ID
}

message GetProfileResp {
    int64 userId = 1;   // 用户ID
    string username = 2; // 用户名
    string nickname = 3; // 昵称
}

// ══════════ M15a 手机号/微信登录（契约照抄 server_v2 identity，字段序号一致）══════════

// 第三方类型（照抄 server_v2 ThirdPartyKind）
enum ThirdPartyKind {
    THIRD_PARTY_KIND_UNSPECIFIED = 0;
    THIRD_PARTY_KIND_WECHAT_MINI_PROGRAM = 1; // 微信小程序
    THIRD_PARTY_KIND_WECHAT_APP = 2;          // 微信 App
}

// 微信 OAuth 场景（照抄 server_v2 WeChatOAuthScene）
enum WeChatOAuthScene {
    WECHAT_OAUTH_SCENE_UNSPECIFIED = 0;
    WECHAT_OAUTH_SCENE_APP = 1;          // App：oauth2 access_token 交换
    WECHAT_OAUTH_SCENE_MINI_PROGRAM = 2; // 小程序：jscode2session 交换
}

message RequestPhoneLoginCodeReq {
    int64 tenantId = 1; // 租户ID（本仓单租户，网关注入 1）
    string phone = 2;   // 手机号（须已绑定，发送前校验——server_v2 语义）
}

message RequestPhoneLoginCodeResp {
    int64 expiresAtUnix = 1; // 验证码过期时间（unix 秒）
    reserved 2;              // 老项目 dev_code 回复字段（照抄保留，不实现）
}

message LoginWithPhoneCodeReq {
    int64 tenantId = 1;          // 租户ID
    string phone = 2;            // 手机号
    string code = 3;             // 短信验证码
    int64 deviceId = 4;          // 设备ID（透传，不参与会话签发，D3）
    string clientFingerprint = 5; // 客户端指纹（透传，不参与会话签发，D3）
}

message LoginWithWeChatCodeReq {
    int64 tenantId = 1;          // 租户ID
    string code = 2;             // 微信登录 code（小程序 jscode / App 授权码）
    WeChatOAuthScene scene = 3;  // 授权场景
    int64 deviceId = 4;          // 设备ID（透传，不参与会话签发，D3）
    string clientFingerprint = 5; // 客户端指纹（透传，不参与会话签发，D3）
}

message SetUserPhoneReq {
    int64 tenantId = 1; // 租户ID
    int64 userId = 2;   // 用户ID
    string phone = 3;   // 大陆手机号（盲索引加密存储，一人一机号）
}

message SetUserPhoneResp {
    int64 userId = 1; // 用户ID
}

message FindUserPhoneExactReq {
    int64 tenantId = 1; // 租户ID
    string phone = 2;   // 手机号（精确查询）
}

message FindUserPhoneExactResp {
    int64 userId = 1; // 用户ID（未绑定=0）
}

message SearchUserPhonesReq {
    int64 tenantId = 1; // 租户ID
    string fragment = 2; // 手机号片段（至少 4 位）
}

message PhoneSearchHit {
    int64 userId = 1;      // 用户ID
    string maskedPhone = 2; // 3-4-4 掩码手机号
}

message SearchUserPhonesResp {
    repeated PhoneSearchHit hits = 1; // 命中列表（候选超 500 → 1014）
}

message LinkThirdPartyIdentityReq {
    int64 tenantId = 1;    // 租户ID
    int64 userId = 2;      // 用户ID
    ThirdPartyKind kind = 3; // 第三方类型
    string openId = 4;     // openid
    string unionId = 5;    // unionid（空时以 openid 回填——server_v2 Link 语义）
}

message LinkThirdPartyIdentityResp {
}

message ResolveUserByThirdPartyReq {
    int64 tenantId = 1;    // 租户ID
    ThirdPartyKind kind = 2; // 第三方类型
    string openId = 3;     // openid
}

message ResolveUserByThirdPartyResp {
    int64 userId = 1; // 用户ID（未绑定=0）
}

message GetThirdPartyIdentityReq {
    int64 tenantId = 1;    // 租户ID
    int64 userId = 2;      // 用户ID
    ThirdPartyKind kind = 3; // 第三方类型
}

message GetThirdPartyIdentityResp {
    string openId = 1;  // openid（未绑定=空）
    string unionId = 2; // unionid
}
