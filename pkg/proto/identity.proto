syntax = "proto3";

package identity;
option go_package = "./identity";

// 账号服务：注册登录（JWT 在本服务签发校验）、手机号/微信登录与第三方身份绑定。
// 从旧仓 user.proto 拆出（资金/资产 RPC 归 asset.proto），RPC 形状与字段序号不变。

service Identity {
    rpc Register(RegisterReq) returns (RegisterResp);
    rpc Login(LoginReq) returns (LoginResp);
    rpc VerifyToken(VerifyTokenReq) returns (VerifyTokenResp);
    rpc GetProfile(GetProfileReq) returns (GetProfileResp);
    // ── 邀请关系 ──
    rpc GetInviteInfo(GetInviteInfoReq) returns (GetInviteInfoResp);
    rpc BindInviteCode(BindInviteCodeReq) returns (BindInviteCodeResp);
    rpc ListInviteRecords(ListInviteRecordsReq) returns (ListInviteRecordsResp);
    // ── M15a 手机号/微信登录（请求形状照抄 server_v2，响应维持本仓 LoginResp）──
    rpc RequestPhoneLoginCode(RequestPhoneLoginCodeReq) returns (RequestPhoneLoginCodeResp);
    rpc LoginWithPhoneCode(LoginWithPhoneCodeReq) returns (LoginResp);
    rpc LoginWithWeChatCode(LoginWithWeChatCodeReq) returns (LoginResp);
    // ── M15a 手机号绑定（内部 RPC，无网关路由——绑定入口照抄 server_v2）──
    rpc SetUserPhone(SetUserPhoneReq) returns (SetUserPhoneResp);
    rpc FindUserPhoneExact(FindUserPhoneExactReq) returns (FindUserPhoneExactResp);
    rpc SearchUserPhones(SearchUserPhonesReq) returns (SearchUserPhonesResp);
    // ── M15a 第三方身份（Link 为内部 RPC，无网关路由；登录靠 Resolve）──
    rpc LinkThirdPartyIdentity(LinkThirdPartyIdentityReq) returns (LinkThirdPartyIdentityResp);
    rpc ResolveUserByThirdParty(ResolveUserByThirdPartyReq) returns (ResolveUserByThirdPartyResp);
    rpc GetThirdPartyIdentity(GetThirdPartyIdentityReq) returns (GetThirdPartyIdentityResp);
    // ── 控制台用户列表 ──
    rpc ListConsoleUsers(ListConsoleUsersReq) returns (ListConsoleUsersResp);
    rpc CreateConsoleUser(CreateConsoleUserReq) returns (ConsoleUser);
    rpc GetConsoleUser(GetConsoleUserReq) returns (ConsoleUser);
    rpc UpdateConsoleUser(UpdateConsoleUserReq) returns (ConsoleUser);
    // ── 控制台用户财务/绑定信息 ──
    rpc GetUserFinance(GetUserFinanceReq) returns (UserFinance);
    rpc UpdateUserFinance(UpdateUserFinanceReq) returns (UserFinance);
    rpc GetUserBindings(GetUserBindingsReq) returns (UserBindings);
    rpc ResetUserBindingLimit(ResetUserBindingLimitReq) returns (ResetUserBindingLimitResp);
}

message RegisterReq {
    string username = 1; // 用户名（登录账号）
    string password = 2; // 明文密码（服务端 bcrypt 加密存储）
    string nickname = 3; // 昵称（可选，默认取用户名）
}

message RegisterResp {
    int64 userId = 1; // 新用户ID
    string publicUserId = 2; // 对外字符串用户ID
}

message LoginReq {
    string username = 1; // 用户名
    string password = 2; // 明文密码
}

message LoginResp {
    int64 userId = 1;   // 用户ID
    string token = 2;   // JWT（网关后续请求放 Authorization: Bearer <token>）
    string publicUserId = 3; // 对外字符串用户ID
}

message VerifyTokenReq {
    string token = 1; // JWT
}

message VerifyTokenResp {
    int64 userId = 1;   // 用户ID（网关鉴权中间件写入 ctx）
    string username = 2; // 用户名
    string nickname = 3; // 昵称
    string publicUserId = 4; // 对外字符串用户ID
}

message GetProfileReq {
    int64 userId = 1; // 用户ID
}

message GetProfileResp {
    int64 userId = 1;   // 用户ID
    string username = 2; // 用户名
    string nickname = 3; // 昵称
    string publicUserId = 4; // 对外字符串用户ID
}

// ── 邀请关系 ──
message GetInviteInfoReq {
    int64 userId = 1;
}

message GetInviteInfoResp {
    string code = 1;            // 我的邀请码
    int64 invitedCount = 2;     // 已邀请好友数
    int64 rewardPoints = 3;     // 已发放吉祥值
    int64 pendingPoints = 4;    // 待领取吉祥值
}

message BindInviteCodeReq {
    int64 userId = 1;           // 被邀请人（网关从 JWT 取）
    string code = 2;            // 邀请码
}

message BindInviteCodeResp {
    bool bound = 1;
    bool alreadyBound = 2;
}

message InviteRecordItem {
    int64 inviteeUserId = 1;
    string inviteePublicId = 2;
    string inviteeNickname = 3;
    int64 rewardPoints = 4;
    int32 status = 5;           // 0=待领取 1=已发放 2=已过期
    int64 boundAtUnix = 6;
    int64 rewardAtUnix = 7;
    int64 expiresAtUnix = 8;
}

message ListInviteRecordsReq {
    int64 userId = 1;
}

message ListInviteRecordsResp {
    repeated InviteRecordItem items = 1;
}

// ══════════ M15a 手机号/微信登录（契约照抄 server_v2 identity，字段序号一致）══════════

// 第三方类型（照抄 server_v2 ThirdPartyKind）
enum ThirdPartyKind {
    THIRD_PARTY_KIND_UNSPECIFIED = 0;
    THIRD_PARTY_KIND_WECHAT_MINI_PROGRAM = 1; // 微信小程序
    THIRD_PARTY_KIND_WECHAT_APP = 2;          // 微信 App
}

// 微信 OAuth 场景（照抄 server_v2 WeChatOAuthScene）
enum WeChatOAuthScene {
    WECHAT_OAUTH_SCENE_UNSPECIFIED = 0;
    WECHAT_OAUTH_SCENE_APP = 1;          // App：oauth2 access_token 交换
    WECHAT_OAUTH_SCENE_MINI_PROGRAM = 2; // 小程序：jscode2session 交换
}

message RequestPhoneLoginCodeReq {
    int64 tenantId = 1; // 租户ID（本仓单租户，网关注入 1）
    string phone = 2;   // 手机号（须已绑定，发送前校验——server_v2 语义）
}

message RequestPhoneLoginCodeResp {
    int64 expiresAtUnix = 1; // 验证码过期时间（unix 秒）
    reserved 2;              // 老项目 dev_code 回复字段（照抄保留，不实现）
}

message LoginWithPhoneCodeReq {
    int64 tenantId = 1;          // 租户ID
    string phone = 2;            // 手机号
    string code = 3;             // 短信验证码
    int64 deviceId = 4;          // 设备ID（透传，不参与会话签发，D3）
    string clientFingerprint = 5; // 客户端指纹（透传，不参与会话签发，D3）
}

message LoginWithWeChatCodeReq {
    int64 tenantId = 1;          // 租户ID
    string code = 2;             // 微信登录 code（小程序 jscode / App 授权码）
    WeChatOAuthScene scene = 3;  // 授权场景
    int64 deviceId = 4;          // 设备ID（透传，不参与会话签发，D3）
    string clientFingerprint = 5; // 客户端指纹（透传，不参与会话签发，D3）
}

message SetUserPhoneReq {
    int64 tenantId = 1; // 租户ID
    int64 userId = 2;   // 用户ID
    string phone = 3;   // 大陆手机号（盲索引加密存储，一人一机号）
}

message SetUserPhoneResp {
    int64 userId = 1; // 用户ID
}

message FindUserPhoneExactReq {
    int64 tenantId = 1; // 租户ID
    string phone = 2;   // 手机号（精确查询）
}

message FindUserPhoneExactResp {
    int64 userId = 1; // 用户ID（未绑定=0）
}

message SearchUserPhonesReq {
    int64 tenantId = 1; // 租户ID
    string fragment = 2; // 手机号片段（至少 4 位）
}

message PhoneSearchHit {
    int64 userId = 1;      // 用户ID
    string maskedPhone = 2; // 3-4-4 掩码手机号
}

message SearchUserPhonesResp {
    repeated PhoneSearchHit hits = 1; // 命中列表（候选超 500 → 1014）
}

message LinkThirdPartyIdentityReq {
    int64 tenantId = 1;    // 租户ID
    int64 userId = 2;      // 用户ID
    ThirdPartyKind kind = 3; // 第三方类型
    string openId = 4;     // openid
    string unionId = 5;    // unionid（空时以 openid 回填——server_v2 Link 语义）
}

message LinkThirdPartyIdentityResp {
}

message ResolveUserByThirdPartyReq {
    int64 tenantId = 1;    // 租户ID
    ThirdPartyKind kind = 2; // 第三方类型
    string openId = 3;     // openid
}

message ResolveUserByThirdPartyResp {
    int64 userId = 1; // 用户ID（未绑定=0）
}

message GetThirdPartyIdentityReq {
    int64 tenantId = 1;    // 租户ID
    int64 userId = 2;      // 用户ID
    ThirdPartyKind kind = 3; // 第三方类型
}

message GetThirdPartyIdentityResp {
    string openId = 1;  // openid（未绑定=空）
    string unionId = 2; // unionid
}

message ConsoleUser {
    int64 userId = 1;
    string username = 2;
    string nickname = 3;
    string phone = 4;
    string avatarUrl = 5;
    int32 status = 6; // 1 正常 / 2 禁用
    string luckyDisplay = 7;
    string registerIp = 8;
    string registerDevice = 9;
    int32 rebateRate = 10;
    string identity = 11;
    int64 createdAtUnixMillis = 12;
    int64 updatedAtUnixMillis = 13;
    int64 parentUserId = 14;
    bool reissueLuckPoints = 15;
    string publicUserId = 16; // 对外字符串用户ID
}

message ListConsoleUsersReq {
    int64 tenantId = 1;
    string keyword = 2;  // 昵称 / 用户ID
    string phone = 3;    // 手机号精确匹配
    string identity = 4; // 身份
    int32 status = 5;    // 0=全部 1=正常 2=禁用
    uint32 page = 6;
    uint32 pageSize = 7;
}

message ListConsoleUsersResp {
    repeated ConsoleUser items = 1;
    uint64 total = 2;
}

message CreateConsoleUserReq {
    int64 tenantId = 1;
    string requestId = 2;
    string nickname = 3;
    string phone = 4;
    string avatarUrl = 5;
    int32 rebateRate = 6;
    string identity = 7;
}

message GetConsoleUserReq {
    int64 tenantId = 1;
    int64 userId = 2;
}

message UpdateConsoleUserReq {
    int64 tenantId = 1;
    string requestId = 2;
    int64 userId = 3;
    string nickname = 4;
    int32 status = 5;
    string luckyDisplay = 6;
    int64 parentUserId = 7;
    bool reissueLuckPoints = 8;
    string avatarUrl = 9;
    int32 rebateRate = 10;
    string identity = 11;
}

message WalletSetting {
    int32 kind = 1;
    bool enabled = 2;
    string balance = 3; // 由网关从资金服务填充
}

message UserFinance {
    int64 userId = 1;
    repeated WalletSetting wallets = 2;
    int64 refundLimitFen = 3;        // 管理员设置（0=默认）
    int32 refundLimitCount = 4;      // 管理员设置（0=默认）
    int64 effectiveLimitFen = 5;     // 当前生效
    int32 effectiveLimitCount = 6;   // 当前生效
}

message GetUserFinanceReq {
    int64 tenantId = 1;
    int64 userId = 2;
}

message UpdateUserFinanceReq {
    int64 tenantId = 1;
    int64 userId = 2;
    repeated WalletSetting wallets = 3;
    int64 refundLimitFen = 4;
    int32 refundLimitCount = 5;
}

message PaymentBinding {
    int64 id = 1;
    int64 createdAtUnixMillis = 2;
    int64 userId = 3;
    string name = 4;
    string paymentAccount = 5;
}

message RealnameBinding {
    int64 id = 1;
    int64 createdAtUnixMillis = 2;
    int64 userId = 3;
    string name = 4;
    string idCard = 5;
    string phone = 6;
}

message UserBindings {
    repeated PaymentBinding payments = 1;
    repeated RealnameBinding realnames = 2;
}

message GetUserBindingsReq {
    int64 tenantId = 1;
    int64 userId = 2;
}

message ResetUserBindingLimitReq {
    int64 tenantId = 1;
    int64 userId = 2;
    string kind = 3; // sms / realname
}

message ResetUserBindingLimitResp {
}
